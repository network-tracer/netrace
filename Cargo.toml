[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
netrace-sim = { path = "crates/netrace-sim" }
netrace-doc = { path = "crates/netrace-doc" }
netrace-engine = { path = "crates/netrace-engine" }
netrace-cli = { path = "crates/netrace-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
