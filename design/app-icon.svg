<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48484A"/>
      <stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- macOS icon grid: 824pt body inside the 1024pt canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M512 336 L336 650 M512 336 L688 650 M336 650 L688 650"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="512" cy="336" r="78"/>
    <circle cx="336" cy="650" r="78"/>
    <circle cx="688" cy="650" r="78"/>
  </g>
  <g fill="#1C1C1E" opacity="0.18">
    <circle cx="512" cy="336" r="30"/>
    <circle cx="336" cy="650" r="30"/>
    <circle cx="688" cy="650" r="30"/>
  </g>
  <circle cx="424" cy="493" r="36" fill="#0A84FF"/>
</svg>
